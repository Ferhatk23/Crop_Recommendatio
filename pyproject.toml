[project]
name = "tradediary"
version = "0.1.0"
description = "Trading-Journal mit automatischer Übernahme aus MT5"
requires-python = ">=3.11"

# `core/` selbst kommt ohne all das aus -- reine Logik über Dataclasses,
# keine Datenbank, kein Netz. Das ist Absicht und soll so bleiben. Was
# hier steht, brauchen Speicher und Schnittstelle darum herum.
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx wird von FastAPIs TestClient gebraucht, nicht vom Betrieb.
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradediary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
